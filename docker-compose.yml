services:
  web:
    build: .
    image: fixture-planner:latest
    environment:
      PORT: 8080
      HOST: 0.0.0.0
    ports:
      # 宿主机端口可通过环境变量 APP_PORT 配置，默认 8080
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # 一次性验收服务：构建镜像 -> 代码测试 -> HTTP 冒烟，以退出码报告结果后自行退出
  verify:
    build: .
    image: fixture-planner:latest
    depends_on:
      web:
        condition: service_healthy
    environment:
      SMOKE_PORT: "8099"
    command: >
      sh -c "echo '== 单元测试 ==' &&
             node --test test/*.test.js &&
             echo '== HTTP 冒烟 ==' &&
             node smoke/smoke.mjs"
    restart: "no"
